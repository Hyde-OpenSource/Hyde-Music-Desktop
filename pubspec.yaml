name: hyde_music
description: "Hyde Music for Windows and Linux — Liquid Glass music player on the pure-Dart Hyde engine."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  cached_network_image: ^4.0.4
  liquid_glass_easy: ^4.3.4
  flutter_cache_manager: ^3.4.5
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  http: ^1.6.0
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  crypto: ^3.0.7
  youtube_explode_dart: ^3.1.0
  permission_handler: ^12.0.1
  package_info_plus: ^10.2.2
  file_picker: ^13.1.0
  archive: ^4.3.0
  record: ^7.1.1
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
  nsd: ^5.0.1
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  # Cupertino-only app. No Material widgets, no Material icon font.
  uses-material-design: false


  assets:
    - assets/hyde_logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
